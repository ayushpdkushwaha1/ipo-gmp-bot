name: Twice Daily IPO GMP Scraper

on:
  schedule:
    # UTC 03:30 (9:00 AM IST) & UTC 09:30 (3:00 PM IST)
    - cron: '30 3,9 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  run-gmp-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright & Chromium Browser
        run: |
          python -m playwright install --with-deps chromium

      - name: Run GMP Script
        run: |
          python gmp.py

      - name: Save Updated Files to GitHub Repo
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add files/
          git commit -m "Auto-update Excel & HTML files" || exit 0
          git push